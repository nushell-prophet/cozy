# Egress policy for the cozy container. Allowlist by domain name, default deny.
#
# No TLS interception and no CA anywhere: squid refuses the CONNECT before the
# handshake starts, so a blocked request never leaves the client — headers and
# auth tokens included. An intercepting proxy would have to read them first to
# reject them. Allowed domains are tunneled end-to-end and keep the origin's own
# certificate, which `cozy verify` asserts.

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl CONNECT method CONNECT
acl SSL_ports port 443

# dstdomain matches the host label-wise, not by substring, so a lookalike like
# api.anthropic.com.evil.example cannot match an entry. This is why the list is
# domains and not regexes.
http_access deny manager
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

http_port 3128

# A cache would serve the agent stale answers and buy nothing here.
cache deny all

# The human managing the list needs to see what it just refused, so this has to
# reach `docker compose logs -f egress`. Not /dev/stdout: squid drops to user
# `proxy`, which cannot open it, and dies at startup. The image's entrypoint
# already tails this path to stdout for us.
access_log stdio:/var/log/squid/access.log
