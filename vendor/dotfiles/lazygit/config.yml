# Lazygit sets TERM=dumb in its pager PTY, so delta can't auto-detect truecolor.
# --true-color=always: forces delta to emit 24-bit color for syntax highlighting.
# --minus/plus-style 256-color: lazygit's ANSI parser drops truecolor backgrounds
#   (48;2;R;G;B) but handles 256-palette backgrounds (48;5;N) correctly.
#   Without these, hunk backgrounds disappear inside lazygit.
# Docker sandbox has no system clipboard. We use the pbcopy OSC 52 shim
# installed in the Dockerfile (see cozy/Dockerfile, cozy/docker-files/pbcopy).
# On macOS pbcopy is a system command. On Linux without cozy, put a pbcopy on PATH
# (an OSC 52 shim, or a wrapper of `xclip -selection clipboard` / `wl-copy`), or change this line.
os:
  # Not `printf {{text}}` (the lazygit docs example) because: printf reads that argument as a format.
  #   A copied diff hunk keeps its +/- prefixes, so it starts with '-': printf fails with "invalid option",
  #   pbcopy gets nothing and sends an empty clipboard, and the pipe still exits 0, so lazygit reports success.
  #   '%' and '\' in the text are expanded too.
  copyToClipboardCmd: printf %s {{text}} | pbcopy
# Why: q in the log view (X below) returns to lazygit at once, not after a "Press enter" pause.
#   The key is global, so leaving an editor started from lazygit has no pause either.
promptToReturnFromSubprocess: false
gui:
  # Why: the staging view opens with the cursor on one line, not on a whole hunk; `a` toggles hunk mode.
  useHunkModeInDiffView: false
git:
  autoFetch: false
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --true-color=always --minus-style='syntax 52' --plus-style='syntax 22' --line-numbers --side-by-side --wrap-max-lines 20
customCommands:
  # The log view (log-view.yml), opened as a nested lazygit; q returns here.
  # Why a key inside lazygit: switch to the view from the lazygit that zellij Super Alt l opens.
  # Not `lazygit log` (half screen mode) because: the side and main sections are split 50/50 there,
  #   and sidePanelWidth does not apply.
  # --screen-mode normal: the `log` argument alone turns on half screen mode.
  - key: 'X'
    context: 'global'
    command: 'lazygit --use-config-file "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/log-view.yml" --screen-mode normal log'
    output: terminal
    description: 'Log view: commits at full height, diff on the right'
  # Why SelectedPath: SelectedFile is always the selection of the files panel, also when commitFiles
  #   is focused; SelectedPath is the commit file's path there, the working-tree path otherwise.
  - key: 'E'
    context: 'files, commitFiles'
    command: 'zellij edit {{.SelectedPath | quote}}'
    description: 'Edit file in Zellij'
  # Copy an agent-ready pointer to the clipboard (pbcopy = OSC 52 -> host).
  # Why: hand an agent a precise file reference, like the helix selected-text command.
  # Selected file (working tree or a commit's file list) -> absolute path of the file on disk,
  #   as `+ Y` in helix. The agent opens it directly, no git needed.
  # Not <branch>:<path> because: a branch tip moves (unstable link), and git already
  #   reads <branch>:<path> as the *committed* blob, not the file on disk you're pointing at.
  # Why the error on a missing file: a commit file can be gone from the worktree, and a path
  #   to nothing reaches the agent as a valid pointer.
  # The copy runs inside nu: a failed command piped into pbcopy would send an empty clipboard and exit 0.
  - key: '<c-y>'
    context: 'files, commitFiles'
    command: 'P={{.SelectedPath | quote}} nu --no-config-file --commands ''let r = $env.P | path expand; if not ($r | path exists) { error make --unspanned {msg: $"no file on disk: ($r)"} }; $r | ^pbcopy; print $"copied: ($r)"'''
    description: 'Copy absolute path to clipboard'
    output: log
  # Selected file (working tree or a commit's file list) -> path relative to the dir lazygit was launched from.
  # Why ctrl+o: it is lazygit's built-in copy (repo-root path), so muscle memory lands here.
  # SelectedPath is the commit file's path when commitFiles is focused, the working-tree path otherwise.
  # LG_START_DIR is set by the zellij Super Alt l launcher (sh -c):
  #   lazygit chdirs to the repo root and the shell resets $PWD, so the launch dir is gone here.
  # Why nushell: it is on every machine this config reaches; macOS realpath has no --relative-to.
  # `path relative-to --walk-up` is the call of the helix `+ y` (copy the cwd-relative path).
  # Not `path expand --no-symlink`, as helix has, because: LG_START_DIR is the logical $PWD
  #   (~/repos/<name> is a symlink into the mono), and lazygit runs in the physical repo path,
  #   so only resolved paths share a prefix.
  # Unset LG_START_DIR fails loudly on its own (Cannot find column 'LG_START_DIR').
  - key: '<c-o>'
    context: 'files, commitFiles'
    command: 'P={{.SelectedPath | quote}} nu --no-config-file --commands ''let r = $env.P | path expand | path relative-to ($env.LG_START_DIR | path expand) --walk-up; $r | ^pbcopy; print $"copied: ($r)"'''
    description: 'Copy cwd-relative path to clipboard'
    output: log
  # File at a specific commit -> change-id link <repo>@<change-id>:<repo-relative-path>,
  #   the format of `cozy git link` and of the helix `+ t` tag; `cozy git resolve` prints the file.
  # Why the Change-Id and not the sha: a rebase gives the commit a new sha, and the Change-Id
  #   trailer travels in the message, so the link survives a history rewrite.
  # Why only commitFiles: the files panel lists only changed files, and a link names committed content.
  # Not a call of `cozy git link` because: it links the last commit that touched the file in the
  #   worktree, not the selected one, and the cozy module is absent on a host; this inline copy
  #   keeps its rules: repo = the main checkout, the sha when the commit has no Change-Id,
  #   an error on two ids.
  # The copy runs inside nu: a failed nu piped into pbcopy would send an empty clipboard and exit 0.
  # Why ctrl+t: the same letter as `+ t` in helix. It shadows the built-in `git difftool` of this
  #   panel only; in the other panels ctrl+t stays difftool.
  - key: '<c-t>'
    context: 'commitFiles'
    command: 'H={{.SelectedCommit.Hash | quote}} P={{.SelectedCommitFilePath | quote}} nu --no-config-file --commands ''let loc = ^git rev-parse --path-format=absolute --git-common-dir --git-dir --show-toplevel | lines; let repo = if $loc.1 == $loc.0 { $loc.2 } else if ($loc.0 | path basename) == ".git" { $loc.0 | path dirname } else { $loc.0 }; let ids = ^git log --max-count 1 "--format=%(trailers:key=Change-Id,valueonly)" $env.H | lines | compact --empty; let rev = match ($ids | length) { 0 => $env.H, 1 => $ids.0, _ => { error make --unspanned {msg: $"commit ($env.H) carries ($ids | length) Change-Id trailers"} } }; let r = $"($repo)@($rev):($env.P)"; $r | ^pbcopy; print $"copied: ($r)"'''
    description: 'Copy change-id link <repo>@<change-id>:<path> to clipboard'
    output: log
