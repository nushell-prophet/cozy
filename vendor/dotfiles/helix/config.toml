theme = "ayu_evolve_cozy" # ayu_evolve plus a grey `↪`, see runtime/themes/ayu_evolve_cozy.toml

[editor]
auto-pairs = false
auto-save = false
bufferline = "multiple"
cursorcolumn = true
cursorline = true
# Why: `y`, `d`, `c`, `p`, `P` and `R` then all use the system clipboard with their stock commands,
# so each selection of a multicursor yank keeps its own text, and `"b p` reads the register it names.
# Not a clipboard command on each key (`paste_clipboard_after`, `yank_to_clipboard`) because:
# such a command ignores a selected register.
default-yank-register = "+"
insert-final-newline = true
# Why: the words nearest to the cursor get the first letters of the alphabet, so the
# home row goes first: the labels typed most often are the easiest to reach.
jump-label-alphabet = "asdfghjklqwertyuiopzxcvbnm"
line-number = "relative"
mouse = false
preview-completion-insert = true
shell = ["hx-nu", "--no-newline", "--stdin", "-c"]

[editor.whitespace.render]
nbsp = "all"
newline = "all"
nnbsp = "all"
space = "all"
tab = "all"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
render = true
skip-levels = 1

[editor.soft-wrap]
enable = true
wrap-indicator = "↪ "
max-wrap = 25 # increase value to reduce forced mid-word wrapping

[editor.lsp]
auto-signature-help = false

[editor.statusline]
left = ["mode", "spinner", "file-name", "total-line-numbers", "file-encoding"]
center = []
right = ["selections", "primary-selection-length", "position", "position-percentage", "spacer", "diagnostics", "workspace-diagnostics", "version-control"]

[keys.normal]
X = ["extend_line_up", "extend_to_line_bounds"]
# move the selected lines down or up.
# Why a macro that selects the `"` register first: the move cuts and pastes the lines, and with the
# default register it would write the system clipboard on each press. A command sequence cannot
# select a register, so the macro selects it and then runs the sequence, which sits under `F20`.
C-j = '@""<F20>j'
C-k = '@""<F20>k'
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"

# reload the file, take the `✅` or `⚠` of a finished agent turn off the pane title, remember the
# text just read as the base of the next `\ k` or `\ l` merge (`nu-hx merge-save`), and say in
# the status line what changed on disk since the last gi key or `C-r` (`nu-hx reload-note`).
# Why base-note here: a reload is the one sync with the disk that no gi key makes.
# Why `:reload` last: its error, a file gone from disk, is then the last status line.
# The base is then noted before the reload reads the disk: a write in that gap is on both
# sides of the next merge, and `git merge-file` merges it clean.
# Not `:sh` because: it sets `Command run` in a job callback after the whole key, over the
# error of `:reload`. The cost of `%sh{}`: it blocks Helix while hx-nu starts.
'C-r' = [":echo %sh{nu-hx reload-note r#'%{buffer_name}'#}", ":reload"]

[keys.normal.F20]
j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

[keys.insert]
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
S-tab = "move_parent_node_start"
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"
pageup = "no_op"
pagedown = "no_op"
home = "no_op"
end = "no_op"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"

[keys.normal."+"]
# Some keys here call tools from outside this repo: `+ e` needs dotnu, and `+ t` needs the
# `cozy git link` command of cozy. The commit keys (`+ g`, `+ G`, and both under `+ +`) need
# zellij: `nu-hx commit` opens the editor of git with `zellij run`. Without them, only those keys fail.
# Helper bodies live in nu-hx.nu (hx-nu loads it for every shell call). Bindings use
# the :pipe family because only it sends the selection on stdin; a selection pasted
# into the command as %{selection} breaks on unlucky content (e.g. a stray '#).
a = ''':pipe #run selection, append output as # => comments→
nu-hx annotate
'''
A = ''':pipe #run selection, append output as # => comments, max 7 lines→
nu-hx annotate --abbreviate
'''

# Select a nu expression, press `+ b`: it evaluates the selection and grows the
# result as a RECTANGLE on the line(s) BELOW the command, aligned to the command's
# indent (the column-respect Helix's built-in `!` lacks). The command stays as a
# label. Seamless because it's a key sequence, not a prompt: nu-hx block-below edits
# the file on disk, so the buffer is saved first and re-read after.
b = [ # run selection, write its output as a block below it
  ":update",
  ":new",
  ":buffer-close!",
  ":pipe-to nu-hx block-below r#'%{buffer_name}'# %{selection_line_end}",
  ":reload",
]

# the selection comes from stdin ($in), so prose with `'#` (markdown headers etc.)
# can't terminate the prompt string
# Why: the flags skip settings, CLAUDE.md, MCP servers, tools and skills — about 2x faster,
# and the reply holds only the corrected text, with no rules from CLAUDE.md
c = '''
:pipe #correct english→
^claude -p --model haiku --setting-sources '' --strict-mcp-config --tools '' --disable-slash-commands --no-session-persistence $"Correct grammar in the text. Respond only with corrected text.\n<text>($in)</text>"
'''

x = ":pipe nu-hx clear-annotations" # remove `# =>` result comments

e = ":pipe dotnu embeds-update" # rerun `| print $in` capture points, refresh `# =>` embeds

f = ":pipe nu-hx flatten" # flatten-to-nuon

# commit the whole file: save, wait for it as `+ h` does, stage the file, then write the
# message as in `+ G`. Helix cannot prompt for text inside a command list, so git asks.
# Why :pipe-to and --block-until-exit: :reload re-reads the gutter's base (HEAD), so it must
# run after the commit; :sh is async in Helix and `zellij run` returns at once by default.
# keep_primary_selection: :pipe-to runs once per selection, which would commit twice.
# `nu-hx keep` and `report` show a refusal before git starts, such as a file that git ignores.
g = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit the file→
nu-hx keep r#'%{buffer_name}'# { nu-hx commit --add r#'%{buffer_name}'# }
''',
  ":reload",
  ":sh nu-hx report r#'%{buffer_name}'#",
]

# commit in a Zellij pane that takes this pane's place until git exits: git opens its own
# hx on COMMIT_EDITMSG with the staged diff below the scissors line.
# Why the pause on failure: --close-on-exit would hide "nothing to commit" or a hook error
# before it could be read.
# Waits and reloads for the same reason as `+ g`: the gutter.
# Saves first so the final :reload cannot drop unsaved edits.
G = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit with diff→
nu-hx commit r#'%{buffer_name}'#
''',
  ":reload",
]

# stage the selected lines (h for hunk). The gutter compares with HEAD, not the index, so
# it does not change after staging.
# Why :new + :buffer-close! after :update: Helix saves in the background, so a plain
# :update then %sh{} stages the old disk content. Closing a buffer waits for pending
# writes and format-on-save; if the write fails, the close fails and the script refuses
# the [scratch] buffer, so nothing wrong is staged. `+ b` and `+ t` wait the same way.
h = [":update", ":new", ":buffer-close!", ":echo %sh{git-stage-lines r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}}"] # stage the selected lines

n = ":append-output date now | format date %%J-%%Q" # timestamp

# run the whole file in the nu pane of this Zellij tab: paste it there and press Enter.
# Saves first and waits for the save, as `+ b` does, because the text comes from the file on disk.
# Why: a long pipeline is tweaked run after run, and in the nu prompt the cursor goes back to
# the edit point each time; in Helix it stays where it was.
r = [":update", ":new", ":buffer-close!", ":sh nu-hx send-to-nu r#'%{buffer_name}'#"] # run the file in the nu pane of this tab

# re-align the columns of a selected markdown table
p = ":pipe nu-hx align-table"

# `s` copies the selection as an <selected-text> tag with a REPO-RELATIVE path,
# `S` with the ABSOLUTE path. Path is computed in nushell (inside nu-hx copy-tag)
# because `%sh{}` runs through hx-nu (nushell), where POSIX `$(...)` does not work.
s = [ ":pipe-to nu-hx copy-tag r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}" ] # copy selection as a tag with the repo-relative path

S = [ ":pipe-to nu-hx copy-tag --absolute r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}" ] # same, with the absolute path

# `y` copies the path of the file relative to the cwd of Helix, `Y` the absolute path; both show it in the
# status line, so the user sees what went to the clipboard. `path expand` resolves %{buffer_name} against
# the cwd of Helix, which is the cwd of hx-nu.
# `--walk-up` gives `../` for a file outside the cwd. `--no-symlink`, because `path relative-to` compares
# text and `(pwd)` keeps the symlinks of the cwd: plain `path expand` resolves them and turns `sub/a.txt`
# into `../real/sub/a.txt`.
# Not %{file_path_absolute} because: Helix 25.07.1 has no such variable; it came later (helix#12989).
y = ":echo %sh{r#'%{buffer_name}'# | path expand --no-symlink | path relative-to (pwd) --walk-up | tee { pbcopy }}" # copy the path of the file relative to the cwd
Y = ":echo %sh{r#'%{buffer_name}'# | path expand | tee { pbcopy }}" # copy the absolute path of the file

# `t` copies the selection as the same tag addressed by a change-id link instead of a path,
# so it survives a history rewrite. :update comes FIRST: `cozy git link` refuses a file with
# uncommitted changes, and an unsaved buffer would pass that check while differing from the
# commit. On the refusal, `+ g` commits the buffer.
t = [ ":update", ":new", ":buffer-close!", ":pipe-to nu-hx copy-link-tag (cozy git link r#'%{buffer_name}'#) %{selection_line_start} %{selection_line_end}" ] # copy selection as a tag with a change-id link

# `o` opens the file a fragment link names, at the line that holds the fragment: select the link
# (`mi``, or `x` for the whole line), press `+ o`. The link is `path:/fragment/`, a fixed string of
# the target line instead of a line number, so an edit above the line does not stale it. The
# selection goes as an argument, not on stdin: `:open` takes the resolved `path:line:col` from
# %sh{}, and a shell expansion has no stdin. r##'…'## breaks only on a '## inside the selection.
o = ":open %sh{nu-hx resolve-link r##'%{selection}'## r#'%{buffer_name}'#}" # open the fragment link in the selection

w = ":toggle soft-wrap.enable" # toggle soft-wrap

'?' = ":sh nu-hx keys '+' | format pattern '{key}  {does}' | str join (char newline)" # this list

[keys.normal."+"."+"]
# `+ g` and `+ G` with the diff line by line, as `git commit --verbose` shows it.
# Why a submenu: `+ g` and `+ G` show the diff word by word, which suits markdown, and the
# line diff stays one key further for code.
g = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit the file, line diff→
nu-hx keep r#'%{buffer_name}'# { nu-hx commit --add --line-diff r#'%{buffer_name}'# }
''',
  ":reload",
  ":sh nu-hx report r#'%{buffer_name}'#",
]

G = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit with line diff→
nu-hx commit --line-diff r#'%{buffer_name}'#
''',
  ":reload",
]

'?' = ":sh nu-hx keys '+ +' | format pattern '{key}  {does}' | str join (char newline)" # this list

[keys.normal."\\"."\\"]
# the CriticMarkup keys of a gi canvas.
# Why a submenu: other gi keys need `r` in the `\` table.

# comment on the selection in CriticMarkup: `{==selection==}{>><<}`, cursor inside the comment.
# The one key that writes CriticMarkup: a plain edit already shows in git word by word, so only a remark
# tied to a span inside a line needs a tag (a marker line cannot point there).
# A macro, because a :pipe command cannot leave Helix in insert mode at the right place.
# Why 3h after <esc>: `c … <esc>` leaves the cursor on the char after the typed text,
# and 3h walks back over the closing `<<}`.
# Why <gt> and <lt>: a bare > or < starts Helix key notation and fails to parse.
# Why `""` before `c`: the cut span goes through the `"` register, not the system clipboard.
# Why no spaces inside the tags: in CriticMarkup they become part of the text on accept.
# With no selection it wraps the one char under the cursor: select the span first.
i = '@""c{==<C-r>"==}{<gt><gt><lt><lt>}<esc>3hi' # comment on the selection (CriticMarkup)

# settle the CriticMarkup substitution around the cursor: `a` keeps the new text, `r` the old one.
# Why only a substitution: the other tags are quick to edit with standard helix keys.
# Why `ma{`: a tag is one pair of braces, so the cursor may be anywhere inside it.
# Why two pipes: :pipe sees only the selection, so the comment after the tag needs a longer
# one, and the final text stays selected only when the last pipe gets the tag alone.
# Why a macro: the selection has to be made before :pipe. Each pipe that changes the text is one undo step.
# Then the macro presses `\ k`, which commits the file: the subject names the settled tag
# (`gi: {~~ approved 1`), so the decision reaches Claude as a commit of its own.
# `\ k` has to stay a key list: Helix stops a macro that a macro starts.
a = '@ma{vgl<esc>:pipe nu-hx critic-drop-comment<ret><A-;>;ma{:pipe nu-hx critic-resolve<ret>\k' # approve the CriticMarkup substitution under the cursor and commit the file
r = '@ma{vgl<esc>:pipe nu-hx critic-drop-comment<ret><A-;>;ma{:pipe nu-hx critic-resolve --reject<ret>\k' # reject the CriticMarkup substitution under the cursor and commit the file

'?' = ":sh nu-hx keys '\\ \\' | format pattern '{key}  {does}' | str join (char newline)" # this list

[keys.normal."\\"]
# the gi canvas keys: commit a canvas, hand it to Claude, find the agent's markers.
# They are the editor half of the gi protocol of claude-nu. `\ l` also needs zellij, to find the
# Claude pane of the tab, and `\ p` needs nu-cybergraph-git in the repo of the buffer.
# Not a submenu of `+` because: a submenu costs one more key on every canvas action.

# quick commit for a gi canvas: commit this file alone with a message that counts the markers
# and comments it adds and the substitutions it settles (`gi: !! 2, {>> 1, {~~ approved 1`),
# no editor. `+ g` stays for commits with a written message.
# Why no message to write: in a canvas the instructions live in the text; `\ l` then hands
# the batch to Claude.
# The commit also puts the file into the queue of the Claude pane of this tab (`nu-hx.nu`,
# `queue-add`), so a `\ l` in any buffer sends it; `+ g` does the same.
# The whole buffer goes to nu-hx on stdin (`select_all`), and `merge-save` writes it merged
# with what the agent wrote to the file meanwhile; `:reload` then shows the merge, and the
# gutter's base (HEAD) after the commit. `save_selection` and `jump_backward` keep the
# selection across the `select_all`. `nu-hx key` keeps the error of the step for the
# closing `:sh nu-hx report`, which shows it in a popup: `:pipe-to` itself shows none.
# Why not `:update`: Helix refuses the write once the file's mtime moved, by the agent or by
# git with the same text, and a key list cannot stop at that error — `\ l` then went on in
# the scratch buffer of the save-wait trick that `+ g` still uses.
k = [
  "save_selection",
  "select_all",
  ''':pipe-to #quick commit→
nu-hx key r#'%{buffer_name}'# { nu-hx quick-commit r#'%{buffer_name}'# }
''',
  "jump_backward",
  ":reload",
  ":sh nu-hx report r#'%{buffer_name}'#",
]

# let Claude know: type `!git show` of the commits that Claude was not sent yet into the
# Claude pane of this Zellij tab, with Enter: the commits of this file, and of every file
# that `\ k` or `+ g` committed in this tab since the last send. Unsaved or uncommitted edits
# of this file are committed first, as `\ k` does, so one key delivers an edit; `\ k` stays
# for batches.
# While Claude works, `\ k` alone is enough: the gi Stop hook (claude-nu `register.ts`) hands
# the commits over at the turn end, through `nu-hx tell-claude-at-stop`.
# The buffer reaches nu-hx and comes back as `\ k` does, for the same reasons.
# Why a key and not a hook on `+ g`: the user commits several times and tells Claude when done.
l = [
  "save_selection",
  "select_all",
  ''':pipe-to #let Claude know→
nu-hx key r#'%{buffer_name}'# { nu-hx tell-claude r#'%{buffer_name}'# }
''',
  "jump_backward",
  ":reload",
  ":sh nu-hx report r#'%{buffer_name}'#",
]

# search for the agent's canvas markers (!!! ??? %%%), CriticMarkup comments (`{>>`, as
# `\ \ i` writes them) and substitutions (`{~~`, which `\ \ a` and `\ \ r` settle), and the agent's entries from its latest turn (`AA*:`, by the Canvas
# style), and the conflict blocks `nu-hx merge-save` leaves (`<<<<<<<`); n and N jump to the next and previous.
# Why only 3-char: those are the agent's, the ones the user has to act on.
# Why `<<<<<<<` too: the user resolves a conflict block by hand, and `\ k` refuses the file until then.
# Its anchor `^` is the one exception to the rule below: git writes the marker at column 0, so the
# anchor skips its mentions in prose. `<lt>`, because a bare `<` starts a key name in a macro.
# Why `{>>` and not `{==`: `\ \ i` writes both, and one comment should be one stop.
# Why a search, not a selection of all: the user only needs the first hit, n does the rest.
# Why no line anchor: agents also put markers after a list bullet, in headings, mid-line.
# Mentions in backticks match too: Helix regex has no lookaround to skip them.
# `MARKERS` in nu-hx.nu spells the same set for `\ M`: change the two together.
m = '@/!!!|\?\?\?|%%%|\{<gt><gt>|\{~~|AA\*:|^<lt>{7}<ret>' # search for the agent's canvas markers, newest AA*: entries, CriticMarkup comments and substitutions, merge conflicts

# list the markers that `\ m` searches for, from every canvas open in this Zellij session, in one
# buffer: a heading per canvas, newest edit first, and under it a fragment link per marker line.
# The open canvases are the files that the Helix panes started with and the canvases of the Claude
# panes, so a file that Helix opened later with `:open` is not in the list.
# Why a file in ~/.cache/gi: the next `\ M` writes it again, and `:reload` refreshes the one buffer.
M = [":open %sh{nu-hx open-markers}", ":reload", "goto_file_start"] # list the open markers of all open canvases

# follow the fragment link on the line of the cursor into the tab of its canvas: the Helix pane
# there opens it, and Zellij switches to that tab. With no such pane, it opens here, as `+ o` does.
# Why the tab of the canvas: `\ l` hands the commits to the Claude pane of its own tab.
o = ["extend_to_line_bounds", ":open %sh{nu-hx open-link-in-tab r##'%{selection}'## r#'%{buffer_name}'#}", "collapse_selection"] # follow the link on this line, in the tab of its canvas

# make the selected lines a particle of the cybergraph: one line gets `<Qm…>` at its end, several
# lines get `<!-- Qm… -->` and `<!-- /Qm… -->` around them (after `# ` in a .nu file); the particle
# goes to `<repo root>/cybergraph/particles`, and the marked lines and the particle are one commit,
# the rest of the file stays as it is. A marked text that changed gets a new particle that
# replaces the old one (`update-particle`) and the new marker. Waits for the save and reloads as
# `+ g` does, because the command writes the file.
# To repeat or update a block, select it with its tags: a selection inside a tagged block makes
# a second pair of tags around the inner lines.
# Why :pipe-to and not :pipe: the marker comes from the command, which writes the file; a :pipe
# would write the selection a second time. `nu-hx keep` holds the error for the closing
# `report`, as `\ k` does, because :pipe-to shows none.
# Why p: the key makes a particle; `+ t` stays the link tag, which makes none.
p = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  "extend_to_line_bounds",
  ''':pipe-to #make the selected lines a particle→
nu-hx keep r#'%{buffer_name}'# { nu-hx cybergraph-block r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end} }
''',
  ":reload",
  ":sh nu-hx report r#'%{buffer_name}'#",
]

# the CriticMarkup keys are in the `\ \` submenu above.

'?' = ":sh nu-hx keys '\\' | format pattern '{key}  {does}' | str join (char newline)" # this list

[keys.normal."]"]
# walk the changes of the file in the order of their commits: the next block of lines whose last
# commit comes after the one under the cursor. The gutter's `] g` walks only the uncommitted
# hunks, in text order; this walks what the commits of a canvas added, in commit order.
# The usual walk is `] H` to the newest change, then `[ h` back through the older ones.
h = ":goto %sh{nu-hx next-change r#'%{buffer_name}'# %{cursor_line}}" # next change in commit order
H = ":goto %sh{nu-hx next-change --newest r#'%{buffer_name}'# %{cursor_line}}" # the newest change

[keys.normal."["]
h = ":goto %sh{nu-hx next-change --back r#'%{buffer_name}'# %{cursor_line}}" # previous change in commit order
H = ":goto %sh{nu-hx next-change --oldest r#'%{buffer_name}'# %{cursor_line}}" # the oldest change
